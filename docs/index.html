<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transport for Somerset – Open Bus Data</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #222;
    }

    .status {
      padding: 18px;
      border-radius: 10px;
      margin: 20px 0;
      background: #eee;
    }

    .status.sample {
      background: #e8f0ff;
      border-left: 5px solid #3366cc;
    }

    .status.live {
      background: #e8f7e8;
      border-left: 5px solid #16833a;
    }

    .status.backup {
      background: #fff4d6;
      border-left: 5px solid #d18b00;
    }

    .status.stale {
      background: #ffe1e1;
      border-left: 5px solid #c62828;
    }

    .status-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .status-details {
      color: #555;
      font-size: 0.95rem;
    }

    a {
      color: #0057b8;
    }
  </style>
</head>

<body>

  <h1>Transport for Somerset</h1>

  <p>
    Open bus data development endpoint.
  </p>

  <div class="status" id="status">
    Loading data status...
  </div>

  <h2>Data</h2>

  <ul>
    <li><a href="buses.json">buses.json</a></li>
    <li><a href="status.json">status.json</a></li>
  </ul>

  <script>
    function formatAge(seconds) {
      if (seconds < 10) {
        return "just now";
      }

      if (seconds < 60) {
        return `${seconds} seconds ago`;
      }

      const minutes = Math.floor(seconds / 60);

      if (minutes < 60) {
        return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;
      }

      const hours = Math.floor(minutes / 60);

      if (hours < 24) {
        return `${hours} hour${hours === 1 ? "" : "s"} ago`;
      }

      const days = Math.floor(hours / 24);

      return `${days} day${days === 1 ? "" : "s"} ago`;
    }

    function formatLocalTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getStatusTitle(status) {
      switch (status) {
        case "live":
          return "🟢 Live bus data";

        case "backup":
          return "🟠 Backup bus data";

        case "stale":
          return "🔴 Stale bus data";

        case "sample":
          return "🔵 Sample bus data";

        default:
          return "Bus data";
      }
    }

    async function loadStatus() {
      const element = document.getElementById("status");

      try {
        const response = await fetch(
          `status.json?cacheBust=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const status = await response.json();

        const generatedTime = new Date(status.generated_at);
        const ageSeconds = Math.max(
          0,
          Math.floor((Date.now() - generatedTime.getTime()) / 1000)
        );

        element.className = `status ${status.status}`;

        element.innerHTML = `
          <div class="status-title">
            ${getStatusTitle(status.status)}
          </div>

          <div>
            ${formatAge(ageSeconds)}
          </div>

          <div class="status-details">
            ${status.vehicle_count} vehicles ·
            Data timestamp ${formatLocalTime(status.generated_at)}
          </div>
        `;

      } catch (error) {
        console.error(error);

        element.className = "status stale";

        element.innerHTML = `
          <div class="status-title">
            🔴 Data unavailable
          </div>

          <div>
            Unable to retrieve the bus data status.
          </div>
        `;
      }
    }

    loadStatus();
  </script>

</body>
</html>
