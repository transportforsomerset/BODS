name: Update Somerset Bus Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and process BODS data
        run: bun run update
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}

      # validation and commit steps will follow
